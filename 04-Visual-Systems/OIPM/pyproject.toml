[build-system]

requires = ["setuptools>=68"]

build-backend = "setuptools.build_meta"

[project]

name = "oipm"

version = "0.1.0"

description = "Omniversal Image Prompt Maker"

readme = "ReadMe.md"

requires-python = ">=3.11"

dependencies = [

    "pydantic>=2.0,<3.0",

]

[project.optional-dependencies]

dev = [

    "pytest>=8.0,<9.0",

]

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]

where = ["src"]

[tool.pytest.ini_options]

testpaths = ["tests"]

pythonpath = ["src"]

addopts = "-ra"